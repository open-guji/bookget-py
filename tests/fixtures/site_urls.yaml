# Example URLs for offline smoke-testing of adapter URL routing + ID extraction.
#
# Each site lists SEVERAL URL shapes (detail page, reader/viewer, manifest,
# with page/volume suffix, alternate domain, …) so the smoke test guards that
# every real-world entry-point routes to the right adapter and yields a
# non-empty book id. No network is used here — only routing + extract_book_id.
#
# Sources: bookget Wiki 04/05, each adapter's docstring, and existing tests.
# When adding an adapter, append an entry; the coverage-guard test enforces it.

