# Real, working item URLs for the OPT-IN live download-path tests.
#
# These hit the actual sites, so they are marked `live` and deselected by
# default. Run them explicitly to confirm download still works end-to-end:
#     pytest -m live tests/test_live_download.py
#
# Each item exercises the full path: extract_book_id -> get_metadata ->
# get_image_list (kind: images) or get_structured_text (kind: text).
# Only network-reachable sites without login/captcha are listed here;
# Playwright/cookie/IP-gated sites (shidianguji, ncl_rbook, read.nlc.cn,
# guji.nlc.cn, hanchi) are exercised by their own dedicated/live tests.

items:
  # --- IIIF image sites ---
  - site_id: bodleian
    url: "https://digital.bodleian.ox.ac.uk/objects/60834383-7146-41ab-bfe1-48ee97bc04be/"
    kind: images
    min_images: 100
    title_contains: "Bodl"

  - site_id: vatican
    url: "https://digi.vatlib.it/view/MSS_Vat.lat.3773"
    kind: images
    min_images: 50

  - site_id: cambridge_cudl
    url: "https://cudl.lib.cam.ac.uk/view/MS-NN-00002-00041"
    kind: images
    min_images: 10

  - site_id: ndl
    url: "https://dl.ndl.go.jp/pid/2592420"
    kind: images
    min_images: 1
    title_contains: "平妖傳"

  # bnf_gallica: covered by offline routing + test_manifest_url. To add a live
  # entry, pin a VERIFIED real ark whose manifest resolves, e.g.
  #   https://gallica.bnf.fr/iiif/ark:/12148/<real-ark>/manifest.json
  # (the placeholder ark btv1b9006423x returns HTTP 500 — not a real document).

  - site_id: bsb
