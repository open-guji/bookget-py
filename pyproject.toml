[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bookget"
version = "0.3.4"
description = "Download and parse ancient Chinese book resources from digital libraries"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
keywords = ["ancient-books", "digital-library", "downloader", "classical-chinese"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing",
]

dependencies = [
    "aiohttp>=3.8",
    "requests>=2.28",
    # Required by bookget/shared/cjk_match.py for 繁简/异体字 normalization,
    # which search / match / metadata matching all rely on. NOT optional: the
    # module degrades silently without it (论语 stops matching 論語), so a
    # missing OpenCC costs results with no error. See DEVELOPER.md.
    "opencc>=1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",  # asyncio_mode=strict below needs it to collect async tests
    "build>=1.0",
    "ruff>=0.4",
    "pyyaml>=6.0",
]
browser = [
    "playwright>=1.40",
]
tiles = [
    "Pillow>=10.0",  # stitching Zoomify/DeepZoom tiled images (e.g. TNM)
]
ia = [
    "internetarchive>=4.0",  # `bookget upload` / `ia-patch` / `ia-check`
]

[project.scripts]
bookget = "bookget.main:_safe_main"

[tool.setuptools.packages.find]
where = ["."]
include = ["bookget*"]
exclude = ["tests*", "doc*"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
# Live tests hit real external sites and are deselected by default so the
# normal suite stays offline, fast and deterministic. Run them explicitly with:
#     pytest -m live
addopts = "-m 'not live'"
markers = [
    "live: hits real external sites/network (deselected by default; run with `pytest -m live`)",
]
