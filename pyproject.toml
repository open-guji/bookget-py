[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bookget"
version = "0.4.0"
description = "Download and parse ancient Chinese book resources from digital libraries"
readme = "README.md"
authors = [
    { name = "开源古籍 (open-guji)" },
]
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = ["ancient-books", "digital-library", "downloader", "classical-chinese"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing",
]

dependencies = [
    "aiohttp>=3.8",
    "requests>=2.28",
    # Required by bookget/shared/cjk_match.py for 繁简/异体字 normalization,
    # which search / match / metadata matching all rely on. NOT optional: the
    # module degrades silently without it (论语 stops matching 論語), so a
    # missing OpenCC costs results with no error. See DEVELOPER.md.
    "opencc>=1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",  # asyncio_mode=strict below needs it to collect async tests
    "build>=1.0",
    "ruff>=0.4",
    "pyyaml>=6.0",
]
browser = [
    "playwright>=1.40",
]
tiles = [
    "Pillow>=10.0",  # stitching Zoomify/DeepZoom tiled images (e.g. TNM)
]
ia = [
    "internetarchive>=4.0",  # `bookget upload` / `ia-patch` / `ia-check`
]

[project.scripts]
bookget = "bookget.main:_safe_main"

[tool.setuptools.packages.find]
where = ["."]
include = ["bookget*"]
exclude = ["tests*", "doc*"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Start from pyflakes + a slice of pycodestyle that catches real mistakes
# (undefined names, unused imports/variables, duplicate dict keys) rather
# than the full default set, which currently reports ~700 mostly-stylistic
# findings and so gets ignored wholesale. Widen this deliberately, not by
# accident. See DEVELOPER.md.
select = ["F", "E4", "E7", "E9"]
ignore = [
    "E741",  # ambiguous variable names (l/I/O) — present in existing code
]

[tool.ruff.lint.per-file-ignores]
# bookget imports must come AFTER the UTF-8 stdout/stderr setup at the top of
# main.py, otherwise anything they print at import time can hit cp1252.
"bookget/main.py" = ["E402"]
# Quoted forward-reference annotations to types these modules don't import
# at runtime; harmless, and importing them would be circular.
"bookget/adapters/base.py" = ["F821"]
"bookget/adapters/other/wikimedia_commons.py" = ["F821"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
# Live tests hit real external sites and are deselected by default so the
# normal suite stays offline, fast and deterministic. Run them explicitly with:
#     pytest -m live
addopts = "-m 'not live'"
markers = [
    "live: hits real external sites/network (deselected by default; run with `pytest -m live`)",
]
